name: Import original Byte Weavers website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import source repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/nirlepsoft/website.git /tmp/source
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/source/. .
          rm -rf .git

          # Never import IDE metadata or server secrets into this repo.
          rm -rf .idea
          rm -f PHPMailer.php SMTP.php .htaccess

          # Remove the old server-side mail credential blocks before committing.
          python3 - <<'PY'
          from pathlib import Path
          import re

          for name in ('index.php', 'contact-us.php'):
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8', errors='ignore')
              # Keep the header include but remove the PHPMailer request-handling block.
              text = re.sub(
                  r"(<\?php include\('header\.php'\); \?>)\s*<\?php\s*use PHPMailer\\PHPMailer\\PHPMailer;.*?\?>",
                  r"\1",
                  text,
                  count=1,
                  flags=re.S,
              )
              p.write_text(text, encoding='utf-8')
          PY

          cat > .gitignore <<'EOF'
          .idea/
          .DS_Store
          PHPMailer.php
          SMTP.php
          .htaccess
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import and sanitize original website source"
          git push origin HEAD:main
